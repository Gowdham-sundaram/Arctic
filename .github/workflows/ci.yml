name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arctic
          POSTGRES_PASSWORD: arctic_local
          POSTGRES_DB: arctic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arctic -d arctic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://arctic:arctic_local@localhost:5432/arctic?schema=public
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
